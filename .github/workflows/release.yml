name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.0.3)'
        required: true
        type: string

permissions:
  contents: read

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  build:
    name: Build & Package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          6.0.x
          7.0.x
          8.0.x
          9.0.x
          10.0.x

    - name: Get version
      id: version
      run: |
        if [ "${{ github.event_name }}" == "release" ]; then
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"
        else
          VERSION="${{ github.event.inputs.version }}"
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Version: $VERSION"

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore --configuration Release -p:Version=${{ steps.version.outputs.version }}

    - name: Test
      run: dotnet test --no-build --configuration Release --verbosity normal

    - name: Pack
      run: |
        dotnet pack src/Selena/Selena.csproj \
          --configuration Release \
          --no-build \
          -p:Version=${{ steps.version.outputs.version }} \
          --output ./artifacts/packages

    - name: Upload NuGet packages
      uses: actions/upload-artifact@v6
      with:
        name: nuget-packages
        path: ./artifacts/packages/*.nupkg
        retention-days: 30

    - name: Upload Symbol packages
      uses: actions/upload-artifact@v6
      with:
        name: symbol-packages
        path: ./artifacts/packages/*.snupkg
        retention-days: 30

  publish:
    name: Publish to NuGet
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'release'
    environment: nuget
    permissions:
      contents: write
    
    steps:
    - name: Download packages
      uses: actions/download-artifact@v7
      with:
        name: nuget-packages
        path: ./packages

    - name: Download symbol packages
      uses: actions/download-artifact@v7
      with:
        name: symbol-packages
        path: ./packages

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Publish to NuGet.org
      run: |
        dotnet nuget push ./packages/*.nupkg \
          --api-key ${{ secrets.NUGET_API_KEY }} \
          --source https://api.nuget.org/v3/index.json \
          --skip-duplicate
      env:
        NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

    - name: Upload packages to GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          ./packages/*.nupkg
          ./packages/*.snupkg
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}