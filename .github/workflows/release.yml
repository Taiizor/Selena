name: Release

on:
    release:
        types: [published]
    workflow_dispatch:
        inputs:
            version:
                description: "Version number (e.g., 1.0.3)"
                required: true
                type: string

permissions:
    contents: read

env:
    DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
    DOTNET_CLI_TELEMETRY_OPTOUT: true
    DOTNET_NOLOGO: true

jobs:
    build:
        name: Build & Package
        runs-on: ubuntu-latest
        permissions:
            contents: read

        steps:
            - name: Checkout
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Setup .NET
              uses: actions/setup-dotnet@v5
              with:
                  dotnet-version: |
                      6.0.x
                      7.0.x
                      8.0.x
                      9.0.x
                      10.0.x

            - name: Get version
              id: version
              run: |
                  if [ "${{ github.event_name }}" == "release" ]; then
                    VERSION="${{ github.event.release.tag_name }}"
                    VERSION="${VERSION#v}"
                  else
                    VERSION="${{ github.event.inputs.version }}"
                  fi
                  echo "version=$VERSION" >> $GITHUB_OUTPUT
                  echo "Version: $VERSION"

            - name: Restore dependencies
              run: dotnet restore

            - name: Build
              run: dotnet build --no-restore --configuration Release -p:Version=${{ steps.version.outputs.version }}

            - name: Test
              run: dotnet test --no-build --configuration Release --verbosity normal

            - name: Pack
              run: |
                  dotnet pack src/Selena/Selena.csproj \
                    --configuration Release \
                    --no-build \
                    -p:Version=${{ steps.version.outputs.version }} \
                    --output ./artifacts/packages

            - name: Upload NuGet packages
              uses: actions/upload-artifact@v7
              with:
                  name: Selena-${{ steps.version.outputs.version }}-nuget
                  path: ./artifacts/packages/*.nupkg
                  retention-days: 30
                  overwrite: true

            - name: Upload Symbol packages
              uses: actions/upload-artifact@v7
              with:
                  name: Selena-${{ steps.version.outputs.version }}-symbols
                  path: ./artifacts/packages/*.snupkg
                  retention-days: 30
                  if-no-files-found: ignore
                  overwrite: true

    publish:
        name: Publish to NuGet
        runs-on: ubuntu-latest
        needs: build
        if: github.event_name == 'release'
        environment: nuget
        permissions:
            contents: write
            packages: write

        steps:
            - name: Download NuGet packages
              uses: actions/download-artifact@v7
              with:
                  pattern: Selena-*-nuget
                  path: ./packages
                  merge-multiple: true

            - name: Download Symbol packages
              uses: actions/download-artifact@v7
              with:
                  pattern: Selena-*-symbols
                  path: ./packages
                  merge-multiple: true

            - name: Setup .NET
              uses: actions/setup-dotnet@v5
              with:
                  dotnet-version: 10.0.x

            - name: Publish to NuGet.org
              run: |
                  dotnet nuget push ./packages/*.nupkg \
                    --api-key ${{ secrets.NUGET_API_KEY }} \
                    --source https://api.nuget.org/v3/index.json \
                    --skip-duplicate
              env:
                  NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

            - name: Publish to GitHub Packages
              run: |
                  dotnet nuget push ./packages/*.nupkg \
                    --api-key ${{ secrets.GITHUB_TOKEN }} \
                    --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json \
                    --skip-duplicate
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Upload packages to GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                  files: |
                      ./packages/*.nupkg
                      ./packages/*.snupkg
                  body: |
                      ## 📦 Selena NuGet Package

                      This release includes:
                      - **Selena NuGet package** (`.nupkg`) - Main library package
                      - **Symbol package** (`.snupkg`) - Debug symbols for source-level debugging

                      ### Installation
                      ```bash
                      dotnet add package Selena
                      ```

                      ### Links
                      - [NuGet Gallery](https://www.nuget.org/packages/Selena)
                      - [Documentation](https://github.com/${{ github.repository }}#readme)
                  append_body: true
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}